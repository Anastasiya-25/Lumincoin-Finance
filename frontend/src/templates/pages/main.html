<section class="main">
    <h1 class="title mb-xxl-5">Главная</h1>
    <nav class="navbar navbar-light mb-4">
        <form class="container-fluid justify-content-start gap-3 flex-wrap align-items-center p-0">
            <button class="btn btn-outline-secondary active period-filter" data-period="today" type="button">Сегодня</button>
            <button class="btn btn-outline-secondary period-filter" data-period="week" type="button">Неделя</button>
            <button class="btn btn-outline-secondary period-filter" data-period="month" type="button">Месяц</button>
            <button class="btn btn-outline-secondary period-filter" data-period="year" type="button">Год</button>
            <button class="btn btn-outline-secondary period-filter" data-period="all" type="button">Все</button>
            <button class="btn btn-outline-secondary period-filter" data-period="interval" type="button">Интервал</button>
            <div id="datepicker-range" class="d-flex gap-3 align-items-center">
                <div class="d-flex align-items-center gap-1 position-relative">
                    <span>с</span>
                    <a href="javascript:void(0)" class="pe-auto link-secondary fs-6 border-bottom border-secondary text-decoration-none" id="dateFromLink">Дата</a>
                    <input type="text" id="dateFrom" class="position-absolute opacity-0" style="width: 0; height: 0;">
                </div>
                <div class="d-flex align-items-center gap-1 position-relative">
                    <span>по</span>
                    <a href="javascript:void(0)" class="pe-auto link-secondary fs-6 border-bottom border-secondary text-decoration-none" id="dateToLink">Дата</a>
                    <input type="text" id="dateTo" class="position-absolute opacity-0" style="width: 0; height: 0;">
                </div>
            </div>
        </form>
    </nav>

    <div class="charts charts-row d-flex flex-column flex-md-row gap-3 ">

        <div class="chart-wrapper flex-grow-1" style="max-width: 500px; width: 100%;">
            <canvas id="chartIncome"></canvas>
        </div>


        <div class="vr d-none d-md-block" style="height: 400px; opacity: 0.2; min-width: 1px;"></div>

        <div class="chart-wrapper flex-grow-1" style="max-width: 500px; width: 100%;">
            <canvas id="chartExpenses"></canvas>
        </div>


    </div>

</section>
<script src="../node_modules/chart.js" defer></script>
<script src="../../components/main.js" defer></script>
